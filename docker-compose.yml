services:
  olx-monitor:
    image: stephankamus/homedev:olx-monitor
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./src/.env
    environment:
      - NODE_ENV=production
      - TZ=America/Sao_Paulo
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
