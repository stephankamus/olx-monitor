name: Build and Publish image to Docker

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

env:
  # Repositório do Docker Hub. A tag que identifica este serviço é "olx-monitor"
  # (mesmo padrão do :telegram), por isso não vai no IMAGE_NAME.
  IMAGE_NAME: stephankamus/homedev
  LOCAL_IMAGE: olx-monitor:ci

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=olx-monitor
            type=sha,prefix=olx-monitor-,format=short
            type=ref,event=tag,prefix=olx-monitor-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build local primeiro: permite rodar o smoke test antes de publicar.
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # cycletls é um binário Go copiado de outra etapa: garante que carrega na imagem final.
      - name: Smoke test (cycletls)
        run: docker run --rm --entrypoint node ${{ env.LOCAL_IMAGE }} scripts/smoke-test.js

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
