name: Build and Publish image to Docker

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ["v*"]

env:
  IMAGE_NAME: stephankamus/homedev:olx-monitor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build local primeiro: permite rodar o smoke test antes de publicar.
      - name: Build image (local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # cycletls é um binário Go: garante que ele carrega na imagem final.
      - name: Smoke test (cycletls)
        run: |
          docker run --rm --entrypoint node ${{ env.IMAGE_NAME }}"
            require('./components/CycleTls')
              .initializeCycleTLS()
              .then(() => { console.log('cycletls ok'); process.exit(0) })
              .catch((e) => { console.error('cycletls falhou:', e.message); process.exit(1) })
          "

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
